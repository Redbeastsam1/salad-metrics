services:
  salad-metrics-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salad-metrics-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Stores salad_metrics.db persistently on Linux host
      - ./data:/app/data
    environment:
      - SALAD_MODE=server
      - SALAD_DB_FILE=/app/data/salad_metrics.db
      - TZ=Asia/Kolkata
    env_file:
      - path: .env
        required: false
